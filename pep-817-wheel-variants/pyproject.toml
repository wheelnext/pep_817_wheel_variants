[build-system]
requires = ['flit_core >=3,<4']
build-backend = 'flit_core.buildapi'

[project]
name = "pep-817-wheel-variants"
version = "0.0.1"
description = "A helper package to test PEP 817 - Wheel Variants"
authors = [{ name = "Jonathan Dekhtiar", email = "jonathan@dekhtiar.com" }]
requires-python = ">=3.10"
dependencies = [
    "variantlib[cli] @ git+https://github.com/wheelnext/variantlib.git@main",
    "pip @ git+https://github.com/wheelnext/pip.git@pep-817-wheel-variants",
]
